<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>SocietyBrands · August 2026 KPIs</title><style>
    :root{--deep:#2F4A43;--forest:#587068;--ivory:#F6F4EE;--sand:#EDE9DF;--gold:#C8A86B;
      --mut:#6B7280;--line:#E3E0D6;--bad:#B4503C;--good:#1E7A5A;
      --serif:"Iowan Old Style",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
    *{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--deep);font-family:var(--sans);-webkit-font-smoothing:antialiased}
    .wrap{max-width:820px;margin:0 auto;padding:0 24px 56px}
    header{background:linear-gradient(125deg,#1E332E,var(--deep) 55%,var(--forest));color:#fff}
    header .in{max-width:820px;margin:0 auto;padding:26px 24px 24px}
    header img{height:32px}h1{font-family:var(--serif);font-weight:600;font-size:27px;margin:12px 0 3px}
    .sub{opacity:.85;font-size:13px}
    .stance{background:#fff;border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;
      padding:13px 16px;margin-top:16px;font-size:12.5px;color:#5b5448;line-height:1.6}
    .stance b{color:var(--deep)}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;
      box-shadow:0 8px 24px rgba(30,51,46,.05);margin-top:16px;display:flex;gap:16px;align-items:flex-start}
    .num{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--gold);line-height:1;min-width:34px;text-align:center}
    .kt{font-size:15px;font-weight:700;color:var(--deep)}
    .kg{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--deep);margin:4px 0 6px}
    .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
    .chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sand);color:#5b5448}
    .chip.own{background:#58706818;color:var(--forest)}
    .km{font-size:12px;color:#5b5448;margin-top:4px;line-height:1.5}
    .ka{font-size:12.5px;color:var(--deep);margin-top:8px;line-height:1.5;
      border-top:1px dashed var(--line);padding-top:8px}
    .ka .lbl{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-right:6px}
    .b{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;margin-top:9px}
    .b.met{background:#1e7a5a1c;color:var(--good)}.b.partial{background:#c8a86b2e;color:#8a6d35}
    .b.missed{background:#b4503c1c;color:var(--bad)}.b.pending{background:#6b728018;color:var(--mut)}
    .score{background:linear-gradient(125deg,#1E332E,var(--deep));color:#fff;border-radius:14px;
      padding:14px 18px;margin-top:16px;font-weight:700;font-size:13.5px}
    .note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;
      padding:12px 16px;font-size:11.5px;color:#5b5448;line-height:1.6;margin-top:18px}
    footer{text-align:center;color:var(--mut);font-size:11px;margin-top:20px}
    
    .auth-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:24px;
      background:linear-gradient(125deg,#1E332E,var(--deep) 55%,var(--forest))}
    .auth-overlay.show{display:flex}
    .auth-card{background:#fff;border-radius:18px;padding:34px 34px 26px;width:100%;max-width:380px;
      box-shadow:0 24px 70px rgba(0,0,0,.45);display:flex;flex-direction:column}
    .auth-logo{height:28px;align-self:flex-start;margin-bottom:18px;
      filter:brightness(0) saturate(100%) invert(28%) sepia(11%) saturate(900%) hue-rotate(110deg) brightness(92%)}
    .auth-title{font-family:var(--serif);font-weight:600;font-size:21px;color:var(--deep)}
    .auth-sub{font-size:12.5px;color:var(--mut);margin:3px 0 18px}
    .auth-lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:5px}
    .auth-card input{border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;
      font-family:var(--sans);color:var(--deep);margin-bottom:14px;background:var(--ivory)}
    .auth-card input:focus{outline:2px solid #8AA399;background:#fff}
    .auth-err{color:var(--bad);font-size:12.5px;font-weight:600;min-height:18px;margin:-6px 0 8px}
    .auth-btn{border:0;border-radius:11px;padding:13px;font-weight:800;font-size:14.5px;cursor:pointer;
      background:var(--deep);color:#fff;font-family:var(--sans)}
    .auth-btn:hover{filter:brightness(1.12)}.auth-btn:disabled{opacity:.6}
    .auth-foot{text-align:center;font-size:10.5px;color:var(--mut);letter-spacing:.06em;margin-top:14px}
