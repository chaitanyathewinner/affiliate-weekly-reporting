<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>SocietyBrands · VN SEO · Full Report</title><style>
:root{--deep:#2F4A43;--forest:#587068;--ivory:#F6F4EE;--sand:#EDE9DF;--gold:#C8A86B;
  --mut:#6B7280;--line:#E3E0D6;--good:#1E7A5A;--bad:#B4503C;
  --serif:"Iowan Old Style",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--deep);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px 60px}
header{background:linear-gradient(125deg,#1E332E,var(--deep) 55%,var(--forest));color:#fff}
header .in{max-width:1080px;margin:0 auto;padding:26px 24px 24px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
header img{height:30px}h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:10px 0 3px}
.sub{opacity:.85;font-size:13px;max-width:660px;line-height:1.5}.per{font-family:var(--serif);font-size:18px;text-align:right;opacity:.95}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:-24px 0 16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 16px;box-shadow:0 8px 24px rgba(30,51,46,.06);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--forest)}
.kpi.hero::before{background:var(--gold)}
.kl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:700}
.kv{font-family:var(--serif);font-size:27px;font-weight:600;color:var(--deep);margin-top:3px}
.kf{margin-top:7px;font-size:11.5px;color:var(--mut)}
.d{font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px}
.d.up{color:var(--good);background:#1e7a5a17}.d.down{color:var(--bad);background:#b4503c17}.d.flat{color:var(--mut);background:#6b728014}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 8px 24px rgba(30,51,46,.05);margin-bottom:18px}
.panel h3{font-family:var(--serif);font-weight:600;font-size:17px;margin:0 0 3px;color:var(--deep)}
.ph{font-size:11.5px;color:var(--mut);margin-bottom:12px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.q{font-weight:600;color:var(--deep)}
.tag{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:middle}
.tag.b{background:#c8a86b2e;color:#8a6d35}.tag.n{background:#1e7a5a1c;color:var(--good)}
.split{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:6px 0 4px;border:1px solid var(--line)}
.split div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.sb{background:var(--gold)}.sn{background:var(--forest)}
.note{border-radius:12px;padding:12px 16px;font-size:12px;line-height:1.65;margin-top:10px;background:#fff;border:1px solid var(--line)}
.note.gold{border-left:4px solid var(--gold);color:#5b5448}
.note.red{border-left:4px solid var(--bad);color:#6b4034}
.note.grey{border-left:4px solid var(--mut);color:var(--mut)}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.nav a{font-size:12px;font-weight:700;text-decoration:none;color:var(--deep);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px}
footer{text-align:center;color:var(--mut);font-size:11px;margin-top:22px}
@media(max-width:840px){.kpis{grid-template-columns:repeat(2,1fr)}}

.hero{background:linear-gradient(125deg,#1E332E,var(--deep) 60%,var(--forest));color:#fff;
  border-radius:18px;padding:22px 24px;margin-top:18px;box-shadow:0 14px 40px rgba(30,51,46,.22)}
.hero h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:0 0 3px}
.hero .hs{opacity:.8;font-size:12px;margin-bottom:16px}
.wins{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.win{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:13px;padding:13px 14px}
.win .wv{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.1}
.win .wl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.78;font-weight:700;margin-top:5px}
.win .wd{font-size:11px;opacity:.9;margin-top:5px}
.win .up{color:#8FE3B8;font-weight:800}
.gauges{display:flex;gap:26px;flex-wrap:wrap;align-items:center;justify-content:center;padding:6px 0 2px}
.gauge{text-align:center}
.gauge .gl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-top:6px}
.gauge .gsub{font-size:10.5px;color:var(--mut);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.bar-row{display:grid;grid-template-columns:150px 1fr 62px;align-items:center;gap:10px;font-size:12px}
.bar-row .bn{font-weight:600;color:var(--deep)}
.bar-track{height:16px;background:var(--sand);border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--deep)}
.mv{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:11.5px;
  padding:2px 9px;border-radius:999px}
.mv.gain{background:#1e7a5a1c;color:var(--good)}.mv.loss{background:#b4503c1c;color:var(--bad)}
.mv.flat{background:#6b728014;color:var(--mut)}
.geo{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:2px 0 12px}
.geo .gb{background:var(--ivory);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.geo .gv{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--deep);line-height:1.15}
.geo .gk{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-top:4px}
.geo .gd{font-size:10.5px;color:var(--mut);margin-top:4px}
.geo .gv.bad{color:var(--bad)}
@media(max-width:840px){.wins{grid-template-columns:repeat(2,1fr)}.bar-row{grid-template-columns:110px 1fr 54px}
  .geo{grid-template-columns:repeat(2,1fr)}}

    .auth-overlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:24px;
      background:linear-gradient(125deg,#1E332E,var(--deep) 55%,var(--forest))}
    .auth-overlay.show{display:flex}
    .auth-card{background:#fff;border-radius:18px;padding:34px 34px 26px;width:100%;max-width:380px;
      box-shadow:0 24px 70px rgba(0,0,0,.45);display:flex;flex-direction:column}
    .auth-logo{height:28px;align-self:flex-start;margin-bottom:18px;
      filter:brightness(0) saturate(100%) invert(28%) sepia(11%) saturate(900%) hue-rotate(110deg) brightness(92%)}
    .auth-title{font-family:var(--serif);font-weight:600;font-size:21px;color:var(--deep)}
    .auth-sub{font-size:12.5px;color:var(--mut);margin:3px 0 18px}
    .auth-lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:5px}
    .auth-card input{border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;
      font-family:var(--sans);color:var(--deep);margin-bottom:14px;background:var(--ivory)}
    .auth-card input:focus{outline:2px solid #8AA399;background:#fff}
    .auth-err{color:var(--bad);font-size:12.5px;font-weight:600;min-height:18px;margin:-6px 0 8px}
    .auth-btn{border:0;border-radius:11px;padding:13px;font-weight:800;font-size:14.5px;cursor:pointer;
      background:var(--deep);color:#fff;font-family:var(--sans)}
    .auth-btn:hover{filter:brightness(1.12)}.auth-btn:disabled{opacity:.6}
    .auth-foot{text-align:center;font-size:10.5px;color:var(--mut);letter-spacing:.06em;margin-top:14px}
